<svg width="460" height="330" viewBox="0 0 460 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="4" y="4" width="452" height="322" rx="14" fill="url(#tbg)" stroke="#1d4ed8" stroke-opacity="0.45"/>
  <rect x="4" y="4" width="452" height="38" rx="14" fill="#0b1e3a"/>
  <rect x="4" y="28" width="452" height="14" fill="#0b1e3a"/>
  <circle cx="28" cy="23" r="6" fill="#ef4444"/>
  <circle cx="48" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="23" r="6" fill="#22c55e"/>
  <text x="230" y="28" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" fill="#7dd3fc">sudhanshu@dev: ~/about-me</text>

  <g font-family="'Fira Code', monospace" font-size="14">
    <!-- line 1 -->
    <text x="24" y="72" fill="#38bdf8">$ whoami</text>
    <text x="24" y="94" fill="#cbd5e1" opacity="0">Sudhanshu Lawhare &#183; Full Stack Dev
      <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 2 -->
    <text x="24" y="122" fill="#38bdf8" opacity="0">$ cat current_work.txt
      <animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="144" fill="#cbd5e1" opacity="0">&#128295; ERP Education Management System
      <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 3 -->
    <text x="24" y="172" fill="#38bdf8" opacity="0">$ cat learning.txt
      <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="194" fill="#cbd5e1" opacity="0">&#127793; Spring Boot Microservices &#183; RN &#183; Expo
      <animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="214" fill="#cbd5e1" opacity="0">&#9729;&#65039; AWS &#183; Docker
      <animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 4 -->
    <text x="24" y="242" fill="#38bdf8" opacity="0">$ echo $FUN_FACT
      <animate attributeName="opacity" values="0;1" begin="4.0s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="264" fill="#cbd5e1" opacity="0">"I build AI-powered apps that solve
      <animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="282" fill="#cbd5e1" opacity="0"> real-world problems with code."
      <animate attributeName="opacity" values="0;1" begin="4.8s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- prompt + cursor -->
    <text x="24" y="310" fill="#38bdf8" opacity="0">$
      <animate attributeName="opacity" values="0;1" begin="5.4s" dur="0.2s" fill="freeze"/>
    </text>
    <rect x="40" y="298" width="9" height="15" fill="#38bdf8" filter="url(#tglow)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="5.4s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
